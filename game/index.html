<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>

<canvas id="game" width="1280" height="720" aria-label="WARUNG RUSH: masak hidangan kaki lima secepat mungkin dan sajikan sebelum pelanggan pergi"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { boot } from './src/main.js';
  boot(document.getElementById('game'));
</script>
